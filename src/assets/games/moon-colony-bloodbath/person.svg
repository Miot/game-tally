<!--
  人口 token：月球殖民者。
  依据 Rio Grande Games 官方规则书 MCB.pdf 第 2 页的人口指示物重绘为矢量，
  保留圆形徽章与殖民者头像的识别特征，配色改为适配浅色界面。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <defs>
    <linearGradient id="p-visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#dbeafe" />
  <circle cx="32" cy="32" r="30" fill="none" stroke="#2563eb" stroke-width="3" />

  <!-- 肩部与生命维持背包 -->
  <path d="M15 56c0-9.4 7.6-17 17-17s17 7.6 17 17" fill="#ffffff" />
  <path d="M15 56c0-9.4 7.6-17 17-17s17 7.6 17 17" fill="none" stroke="#2563eb" stroke-width="3"
    stroke-linecap="round" />
  <rect x="26" y="45" width="12" height="6" rx="2" fill="#2563eb" opacity="0.35" />

  <!-- 头盔与面罩 -->
  <circle cx="32" cy="26" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  <path d="M32 15.5a10.5 10.5 0 0 1 10.2 8A10.5 10.5 0 0 1 32 34.5a10.5 10.5 0 0 1-10.2-11
    A10.5 10.5 0 0 1 32 15.5z" fill="url(#p-visor)" />
  <path d="M24.5 21.5c1.8-2.6 4.6-4.2 7.8-4.4" fill="none" stroke="#ffffff" stroke-width="2.6"
    stroke-linecap="round" opacity="0.9" />
</svg>
